{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Система голосования{% endblock %}</title>
    
    <!-- 1. Сначала подключаем Bootstrap -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    
    <!-- 2. Затем подключаем НАШИ стили (они переопределят Bootstrap, если нужно) -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- Навигация с логотипом -->
    <nav class="nav mb-4 p-3 shadow-sm align-items-center">
        <!-- 3. Выводим картинку -->
        <img src="{% static 'img/icon.png' %}" alt="Логотип" class="logo-img ms-3">
        
        <a class="nav-link" href="{% url 'pages:index' %}">Главная</a>
        <a class="nav-link" href="{% url 'votes:poll_list' %}">Голосования</a>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Подвал (Footer) -->
    <footer class="container mt-5 mb-3 text-center text-muted">
        <hr>
        <p>© <span id="current-year"></span> Система голосования. Все права защищены.</p>
    </footer>

    <!-- 4. Подключаем JavaScript в самом конце body -->
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
